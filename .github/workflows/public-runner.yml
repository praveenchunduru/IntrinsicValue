name: Portable OpenRouter runner
on:
  push:
    paths: ['investmentideas/**', 'tests/public_runner/**', 'pyproject.toml', '.github/workflows/public-runner.yml']
  pull_request:
    paths: ['investmentideas/**', 'tests/public_runner/**', 'pyproject.toml', '.github/workflows/public-runner.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/public_runner -v
      - run: investmentideas --help
